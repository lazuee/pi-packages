packages:
  - "packages/*"

# Cross-package links use the workspace: protocol explicitly, so a sibling
# always resolves to its source here rather than to whatever npm last published.
# `linkWorkspacePackages: false` makes that opt-in mandatory: with the default,
# a plain `*` or `^1.2.3` specifier silently resolves from the registry even
# when the sibling is in this workspace.
#
# Linking means a consumer compiles the sibling's `src`, but its `exports.types`
# points at the gitignored, unbuilt `dist/`. The `@gotgenes/source` export
# condition (see tsconfig.base.json) bridges that: `types` wins once `dist`
# exists, and each consumer's `check` builds it first. Published consumers are
# unaffected — a tarball ships its `dist/public.d.ts`.
linkWorkspacePackages: false

# Centralize version management across all packages.
# In each package.json, use "catalog:" as the version specifier
# to pull from here (e.g. "vitest": "catalog:").
catalog:
  "@biomejs/biome": "^2.5.11"
  "eslint": "^10.9.1"
  "globals": "^17.12.0"
  "typescript-eslint": "^8.69.0"
  # Pinned exactly, not caret-ranged. Newer releases join a sentence that opens
  # with a reference link or a lowercase word ("[#752] and ...", "release-please
  # reads ...") onto the previous line under our sentence-per-line reflow:
  # 0.2.78 reports 593 MD013 findings across 369 files, 0.2.24 reports none.
  # require-sentence-capital = false trades those joins for false splits after
  # "etc." and closing quotes, so it is not a workaround.
  # Upstream: https://github.com/rvben/rumdl/issues/933
  # Keep prek.toml's rumdl-pre-commit rev in lockstep with this pin.
  "rumdl": "0.2.24"
  "typescript": "^6.0.3"
  "vitest": "^4.1.11"
  # Istanbul coverage for `fallow health --coverage`, which needs Istanbul
  # format (not v8/c8 native). Root-only: a coverage run is `pnpm --filter
  # <pkg> exec vitest run --coverage`, so no package manifest references it.
  "@vitest/coverage-istanbul": "^4.1.11"
  "@types/node": "^22.15.3"
  fallow: "^3.22.0"
  rollup: "^4.63.1"
  "rollup-plugin-dts": "^6.5.1"

allowBuilds:
  "@google/genai": true
  esbuild: false
  fallow: true
  koffi: true
  node-pty: true
  protobufjs: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@fallow-cli/darwin-arm64@3.22.0'
  - '@fallow-cli/darwin-x64@3.22.0'
  - '@fallow-cli/linux-arm64-gnu@3.22.0'
  - '@fallow-cli/linux-arm64-musl@3.22.0'
  - '@fallow-cli/linux-x64-gnu@3.22.0'
  - '@fallow-cli/linux-x64-musl@3.22.0'
  - '@fallow-cli/win32-arm64-msvc@3.22.0'
  - '@fallow-cli/win32-x64-msvc@3.22.0'
  - fallow@3.22.0
  - '@gotgenes/pi-permission-system@40.3.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - globals@17.12.0
  - fallow-type-aware@3.22.0
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'

# A freshly-published first-party sibling (e.g. a same-day @gotgenes/* release a
# dependent package bumps to) cannot be unblocked via minimumReleaseAgeExclude:
# that list is honored during dependency resolution but NOT during pnpm's
# lockfile supply-chain verification pass, which re-applies minimumReleaseAge to
# every pinned lockfile entry and fails CI's frozen install. trustLockfile
# treats the committed, PR-reviewed lockfile as trusted and skips that
# re-verification, so a same-day sibling release installs immediately; the age
# delay still applies to fresh `pnpm add`/`update` resolutions.
trustLockfile: true
