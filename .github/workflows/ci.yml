name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: mise run check
      - run: bunx oxfmt --check .
      - run: bunx oxlint --config oxlint.config.ts
