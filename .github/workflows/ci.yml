name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The shipped `prebuilt/bin/` pair is darwin-arm64, so the contract suites can
    # only run the CLI here. On ubuntu everything that shells out skips and the
    # job passes having exercised none of it. `macos-latest` is arm64, which is
    # the pair in the tree.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run install
      # The contract suites assert a parse (exit 2 means clap rejected the argv),
      # so a runner's missing Accessibility grant and closed apps are fine: those
      # answer 0 or 1. Only a bad flag fails.
      - run: mise run check
      - run: bunx oxfmt --check .
      - run: bunx oxlint --config oxlint.config.ts
