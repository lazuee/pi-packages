[global]
exclude = ["**/CHANGELOG.md", "packages/*/upstream/**"]
disable = ["MD041"]
extend-enable = ["MD060"]

[MD013]
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"

[MD018]
magiclink = true

[MD024]
siblings_only = true

[MD029]
style = "ordered"

[MD033]
allowed_elements = ["p", "img"]

[MD060]
style = "aligned"
