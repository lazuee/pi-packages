[tools]
bun = "1.4.4"
node = "24.22.3"

[env]
# Keep the workspace's install/link state inside the repo.
BUN_INSTALL_CACHE_DIR = "{{config_root}}/.cache/bun"

[tasks.check]
description = "Verify package parity, then type-check every package"
run = "bun run check"

[tasks.build]
description = "Build every package"
run = "bun run --filter '*' build"

[tasks.fmt]
description = "Format and apply lint fixes"
run = "bunx oxfmt . && bunx oxlint --config oxlint.config.ts --fix"

[tasks.lint]
description = "Report lint findings without writing"
run = "bunx oxlint --config oxlint.config.ts"

[tasks.dev]
description = "Load an extension into pi for one session (usage: mise run dev <extension-path>)"
run = "bunx pi -e \"$1\""

[tasks.install]
description = "Install dependencies"
run = "bun install"
