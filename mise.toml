[tools]
bun = "1.4.4"
node = "24.22.3"

[env]
# Keep the workspace's install/link state inside the repo.
BUN_INSTALL_CACHE_DIR = "{{config_root}}/.cache/bun"

[tasks.check]
description = "Type-check every package"
run = "bun run --filter '*' check"


[tasks.build]
description = "Build every package"
run = "bun run --filter '*' build"

[tasks.fmt]
description = "Format the workspace"
run = "bunx prettier --write ."

[tasks.dev]
description = "Load an extension into pi for one session (usage: mise run dev <extension-path>)"
run = "bunx pi -e \"$1\""

[tasks.install]
description = "Install dependencies"
run = "bun install"